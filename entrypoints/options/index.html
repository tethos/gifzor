<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>gifzor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="/icon/48.png" width="40" height="40" alt="" />
        <h1 data-i18n="optionsTitle"></h1>
      </header>

      <form id="form" autocomplete="off">
        <section>
          <h2 data-i18n="optionsDefaults"></h2>
          <div class="field">
            <span class="label" data-i18n="labelWidth"></span>
            <div class="seg" id="width"></div>
          </div>
          <div class="field">
            <span class="label" data-i18n="labelFps"></span>
            <div class="seg" id="fps"></div>
          </div>
          <div class="field">
            <span class="label" data-i18n="optionsColors"></span>
            <div class="seg" id="colors"></div>
          </div>
          <label class="field">
            <span class="label" data-i18n="optionsMaxDuration"></span>
            <input type="number" id="maxDurationSec" min="0" max="120" step="1" />
          </label>
        </section>

        <section>
          <h2 data-i18n="optionsSize"></h2>
          <label class="field">
            <span class="label" data-i18n="optionsMaxSize"></span>
            <input type="number" id="maxSizeMB" min="0" max="500" step="0.5" />
            <small data-i18n="optionsMaxSizeHint"></small>
          </label>
          <label class="check">
            <input type="checkbox" id="autoFit" />
            <span data-i18n="optionsAutoFit"></span>
          </label>
        </section>

        <section>
          <h2 data-i18n="optionsOutput"></h2>
          <label class="field">
            <span class="label" data-i18n="optionsPattern"></span>
            <input type="text" id="filenamePattern" spellcheck="false" />
            <small data-i18n="optionsPatternHint"></small>
            <small class="preview" id="patternPreview"></small>
          </label>
          <label class="check">
            <input type="checkbox" id="copyToClipboard" />
            <span data-i18n="optionsClipboard"></span>
          </label>
        </section>

        <footer>
          <button type="button" id="reset" data-i18n="optionsReset"></button>
          <span id="saved" role="status" aria-live="polite"></span>
        </footer>
      </form>

      <p class="note" data-i18n="optionsTip"></p>
      <p class="note" data-i18n="optionsPrivacy"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
